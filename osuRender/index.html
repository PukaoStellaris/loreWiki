    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0c0a1a; color: #e8e4f0; font-family: 'Segoe UI', sans-serif; }

      #root:empty {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; gap: 28px;
      }
      #root:empty::before {
        content: 'osu! Render Demo';
        font-size: 30px; font-weight: 700; letter-spacing: -0.03em;
        color: #c4b5fd; text-shadow: 0 0 40px #7c3aed55;
        animation: pulse 1.8s ease-in-out infinite;
      }
      #root:empty::after {
        content: ''; width: 36px; height: 36px;
        border: 2px solid #1e1a3a; border-top-color: #c4b5fd;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin  { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/osuRender.jsx"></script>
  </body>
