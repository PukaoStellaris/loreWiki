<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="title" content="Chat Studio — Violet Aegis" />
    <meta name="description" content="Compose and play out character conversations in the Violet Aegis chat studio." />
    <meta name="theme-color" content="#4800b4">

    <meta property="og:site_name" content="Violet Aegis" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.violet-aegis.com/chat" />
    <meta property="og:title" content="Chat Studio — Violet Aegis" />
    <meta property="og:description" content="Compose and play out character conversations in the Violet Aegis chat studio." />
    <meta property="og:image" content="https://www.violet-aegis.com/images/og-cover.jpg" />

    <title>Chat Studio — Violet Aegis</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #1c1917; color: #e8e4f0; font-family: 'Segoe UI', sans-serif; }

      #root:empty {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; gap: 28px;
      }
      #root:empty::before {
        content: 'Chat Studio';
        font-size: 36px; font-weight: 700; letter-spacing: -0.03em;
        color: #c4b5fd; text-shadow: 0 0 40px #7c3aed55;
        animation: pulse 1.8s ease-in-out infinite;
      }
      #root:empty::after {
        content: ''; width: 36px; height: 36px;
        border: 2px solid #1e1a3a; border-top-color: #c4b5fd;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin  { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/chat.jsx"></script>
  </body>
</html>
